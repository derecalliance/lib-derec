language = "C"
header = "// SPDX-License-Identifier: Apache-2.0\n// Copyright (c) 2026 DeRec Alliance. All rights reserved.\n//\n// GENERATED FILE - DO NOT EDIT.\n// Regenerate with: scripts/prepare-react-native-package.sh"
include_guard = "DEREC_FFI_H"
cpp_compat = true
usize_is_size_t = true

[export]
prefix = ""
include = []

# Carry Rust `#[deprecated]` through to the C header, so a C/ObjC/C++ consumer
# gets a compiler warning rather than only a comment they may not read.
[fn]
deprecated = "__attribute__((deprecated))"
deprecated_with_note = "__attribute__((deprecated({})))"

[parse]
parse_deps = false

[enum]
prefix_with_name = true
