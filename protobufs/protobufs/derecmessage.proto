syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "pair.proto";
import "unpair.proto";
import "storeshare.proto";
import "verify.proto";
import "getshare.proto";
import "secretidsversions.proto";
import "updatechannelinfo.proto";
import "prepair.proto";
import "error.proto";

package org.derecalliance.derec.protobuf;

// DeRecMessage is the top-level protocol envelope for all DeRec messages,
// except ContactMessage which is exchanged out-of-band during pairing.
//
// This message represents the unit of communication between an Owner and a
// Helper once a secure channel has been established. Every protocol exchange
// (pairing, sharing, verification, recovery, etc.) is carried inside this
// envelope.
//
// # Security Model
//
// The DeRecMessage envelope itself is not responsible for confidentiality or
// authenticity. Instead:
//
// - The `message` field contains encrypted bytes representing the inner message
// - Encryption is applied at the payload level prior to transport
//
// Implementations MUST ensure that:
//
// - The inner message is encrypted using the agreed channel keys
// - The envelope metadata is treated as untrusted until the payload is verified
//
// # Semantics
//
// A DeRecMessage provides:
//
// - protocol versioning information for compatibility handling
// - the epoch of the channel key the payload is encrypted under
// - channel identification for routing and key selection
// - a timestamp for replay protection and observability
// - an encrypted payload containing exactly one protocol message
//
// The envelope is transport-agnostic and can be delivered over any supported
// transport (e.g., HTTPS, message queues), as defined by TransportProtocol.
//
// # Ordering and Idempotency
//
// Request/response pairing is defined per message type: each request
// message has a corresponding response message, and the response envelope
// echoes the request's `traceId`. Most flows are initiated by the Owner;
// some, such as UpdateChannelInfo, may be initiated by either party.
//
// Delivery of every message, responses included, follows the transport,
// which is push: a response is a separate delivery to the requester's own
// endpoint, not a return value on the delivery that carried the request.
//
// The `sequence` field carries the epoch of the channel key the payload is
// encrypted under; it is not a message counter. A pairing envelope uses 0, and
// so does every channel envelope until the channel's key rotates. The
// receiver selects the key by this value, which is outside the encryption: a
// tampered value selects the wrong key and the payload does not decrypt.
//
// An envelope older than the receiver's configured inbound-message window is
// discarded. After decryption the receiver also checks that
// `envelope.timestamp` equals the inner message's `timestamp`, and discards
// the message if they differ or either is absent.
//
// Within the window, detecting a message delivered more than once is the
// receiving application's transport layer's job. Both ends of a channel
// encrypt under one key, so a message delivered back to its own sender
// decrypts there too. The transport MUST:
//
// - identify an envelope by a hash of its `message` field only. `sequence`,
//  `traceId` and the protocol version are not authenticated, and an
//  envelope can be re-encoded, so a copy can arrive as different bytes;
// - keep the identity of every envelope it accepted and of every envelope
//  it sent until the later of its arrival (or sending) and its `timestamp`,
//  plus the inbound-message window, and drop an inbound envelope whose
//  identity it keeps;
// - record an inbound identity only once the message was accepted.
//
// A message held back and delivered late is a first delivery and is not
// caught this way. A receiver MUST NOT store a share version older than the
// newest it stores on the channel, and SHOULD reject a channel-info update
// older than the last one it accepted on the channel.
//
// # Key Rotation
//
// The channel key is a chain K0, K1, K2, ... where K0 is the key pairing
// established and K(e+1) = HMAC-SHA256(K(e), "derec channel key v1" ||
// be32(e+1)). The Owner advances each Helper channel one epoch in every
// sharing round that reaches the threshold (a round below it advances none),
// and the replica group channel one epoch on every publish to replicas. The
// Helper only follows, by deriving forward from a key it holds when a
// message arrives under a newer epoch. A receiver derives at most 512 steps
// from a key it holds, so a forged epoch cannot cause unbounded work, and a
// message under an epoch it cannot reach is ignored. A party keeps its newest
// key and the key of every epoch a stored secret version travelled under, and
// nothing else.
//
// # Versioning
//
// The protocolVersionMajor and protocolVersionMinor fields allow peers to:
//
// - detect incompatible protocol versions
// - apply backward-compatible parsing logic when possible
//
// Implementations MUST define behavior for handling version mismatches.
//
// # Payload Encoding
//
// The `message` field contains encrypted raw bytes. When decrypted, these bytes
// MUST deserialize into a MessageBody, which contains exactly one concrete
// protocol message.
//
// The oneof structure ensures that each DeRecMessage carries a single logical
// operation.
message DeRecMessage {
  // DeRec protocol major version.
  //
  // Incremented for breaking changes that are not backward compatible.
  uint32 protocolVersionMajor = 1;

  // DeRec protocol minor version.
  //
  // Incremented for backward-compatible changes such as adding new fields
  // or message types.
  uint32 protocolVersionMinor = 2;

  // Epoch of the channel key the payload is encrypted under.
  //
  // The channel key starts at epoch 0, the key pairing established, and
  // advances one epoch each time the Owner rotates it. A pairing envelope
  // carries 0. The receiver selects the decryption key by this value, so it
  // is not a message counter and does not order, deduplicate or replay-protect
  // messages; replay protection relies on `timestamp`.
  //
  // This field is outside the encryption. A tampered value selects the wrong
  // key and the payload does not decrypt.
  uint32 sequence = 3;

  // Channel identifier associated with this communication session.
  //
  // This value uniquely identifies the logical channel between an Owner and
  // a Helper for a given secret. It is established during pairing and used
  // thereafter to:
  //
  // - route messages to the correct channel state
  // - select the appropriate cryptographic keys
  //
  // This MUST match the channelId exchanged during the ContactMessage phase.
  uint64 channelId = 4;

  // Timestamp indicating when the sender created this message.
  //
  // The sender sets this to the same value as the inner message's
  // `timestamp`; the receiver discards a message whose two timestamps differ.
  //
  // This value is expressed in UTC and can be used for:
  //
  // - replay detection
  // - timeout handling
  // - logging and observability
  //
  // Implementations SHOULD NOT rely solely on this value for security-critical
  // decisions without additional protections.
  google.protobuf.Timestamp timestamp = 5;

  // Encrypted message payload.
  //
  // This field contains the encrypted bytes of a serialized MessageBody.
  // The encryption scheme and key material are defined by the pairing process
  // and subsequent key management flows.
  //
  // Upon decryption, this field MUST deserialize into a valid MessageBody
  // containing exactly one protocol message.
  bytes message = 6;

  // Application-supplied correlation token, echoed verbatim by the
  // responder on the matching response envelope.
  //
  // # Purpose
  //
  // Lets the side that originated a request match the eventual response to
  // the in-flight request that produced it, even when:
  //
  // - multiple requests are outstanding on the same channel,
  // - responses arrive out of order with respect to send order,
  // - the responder takes arbitrary time to reply.
  //
  // # Semantics
  //
  // - On a request envelope: the requester sets this to any value it can
  //  use to correlate the response back to the originating call site. A
  //  random `uint64` is a typical choice; collisions are unlikely at any
  //  realistic concurrency level.
  // - On a response envelope: the responder MUST copy the request's
  //  `traceId` verbatim. The library does this automatically in every
  //  response producer.
  // - Zero (the protobuf default when unset) is treated as "no correlation
  //  requested." Responders still echo the zero on the response envelope;
  //  requesters that do not care about correlation simply ignore the
  //  field.
  //
  // # Privacy
  //
  // This field is plaintext on the wire (the envelope is not encrypted).
  // The token itself is opaque, so it carries no information about either
  // peer's identity or intent — it is purely a correlation handle. Passive
  // observers could already correlate request/response pairs by channelId
  // and timing; `traceId` does not add to that exposure.
  uint64 traceId = 7;

  // MessageBody defines all possible DeRec protocol messages that can be
  // transported inside the DeRecMessage envelope.
  //
  // Exactly one of the fields MUST be set when constructing a message.
  message MessageBody {
    oneof body {
      PairRequestMessage pairRequestMessage = 1;
      PairResponseMessage pairResponseMessage = 2;
      UnpairRequestMessage unpairRequestMessage = 3;
      UnpairResponseMessage unpairResponseMessage = 4;
      StoreShareRequestMessage storeShareRequestMessage = 5;
      StoreShareResponseMessage storeShareResponseMessage = 6;
      VerifyShareRequestMessage verifyShareRequestMessage = 7;
      VerifyShareResponseMessage verifyShareResponseMessage = 8;
      GetSecretIdsVersionsRequestMessage getSecretIdsVersionsRequestMessage = 9;
      GetSecretIdsVersionsResponseMessage getSecretIdsVersionsResponseMessage = 10;
      GetShareRequestMessage getShareRequestMessage = 11;
      GetShareResponseMessage getShareResponseMessage = 12;
      ErrorResponseMessage errorResponseMessage = 13;
      UpdateChannelInfoRequestMessage updateChannelInfoRequestMessage = 14;
      UpdateChannelInfoResponseMessage updateChannelInfoResponseMessage = 15;
      PrePairRequestMessage prePairRequestMessage = 16;
      PrePairResponseMessage prePairResponseMessage = 17;
    }
  }
}
